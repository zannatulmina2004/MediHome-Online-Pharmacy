<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - Online Health Care</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/signup.css') }}"
    />
  </head>
  <body>
    <!-- Signup Container -->
    <div class="popup-container">
      <div class="popup-card">
        <span class="close-btn">&times;</span>
        <h2 class="popup-title">Signup</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %} {% endwith %}

        <!-- Signup Form -->
        <form action="{{ url_for('signup') }}" method="POST" class="popup-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input
              type="text"
              id="phone"
              name="phone"
              placeholder="Enter your phone number"
            />
          </div>

          <!-- NEW: B2B / B2C Account Type -->
          <div class="form-group">
            <label>Account Type</label>
            <div style="display:flex; gap:20px; margin-top:6px;">
              <label style="font-weight:normal; display:flex; align-items:center; gap:6px;">
                <input type="radio" name="account_type" value="b2c" checked onclick="toggleBusinessFields()">
                Personal (B2C) &mdash; shopping for myself
              </label>
              <label style="font-weight:normal; display:flex; align-items:center; gap:6px;">
                <input type="radio" name="account_type" value="b2b" onclick="toggleBusinessFields()">
                Business (B2B) &mdash; pharmacy / clinic / hospital
              </label>
            </div>
          </div>

          <div id="business-fields" style="display:none;">
            <div class="form-group">
              <label for="business_name">Business Name</label>
              <input
                type="text"
                id="business_name"
                name="business_name"
                placeholder="e.g. City Pharmacy Ltd."
              />
            </div>
            <div class="form-group">
              <label for="trade_license">Trade License Number (optional)</label>
              <input
                type="text"
                id="trade_license"
                name="trade_license"
                placeholder="Enter your trade license number"
              />
            </div>
            <p style="font-size:0.85rem; color:#666; margin-top:-8px;">
              Business accounts automatically unlock wholesale pricing on bulk orders.
            </p>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Confirm your password"
              required
            />
          </div>

          <button type="submit" class="btn-submit">Signup</button>
        </form>

        <script>
          function toggleBusinessFields() {
            const isB2B = document.querySelector('input[name="account_type"]:checked').value === 'b2b';
            document.getElementById('business-fields').style.display = isB2B ? 'block' : 'none';
          }
        </script>

        <p class="popup-footer">
          Already have an account?
          <a href="{{ url_for('login') }}">Login here</a>
        </p>

        <button class="btn-back">← Go Back</button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
  </body>
</html>
